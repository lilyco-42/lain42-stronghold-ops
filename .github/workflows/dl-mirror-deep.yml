name: dl-mirror 全量整段哈希验收（每月两次）

# 每天那条车道只查头（状态/长度/类型/Range）——那只能证明"键在、尺寸对"，
# 不能证明字节没被改写。manifest 带 sha256 的 20 条一共 2.5 GiB，天天整段回读不值得，
# 所以单独一条月度车道做全量：覆盖面传 all，由 scripts/dl-mirror-expected.json 里有 pin 的条目数决定，
# 不由这个文件里的常数决定（清单加了新条目，这里不用改）。
on:
  schedule:
    # 每月 1 日和 15 日：GitHub 的 schedule 在这个账号上会推迟数小时甚至漏掉，
    # 所以它只是第二道触发，不是唯一一道（见下面 workflow_run）。
    - cron: '37 4 1,15 * *'
  # 本账号实测 cron 到点不落地（见 dl-mirror-check.yml 里那段结论），而 sp-room-api 是
  # 唯一被证明会每天跑成的定时工作流。挂上它，但用日历守卫限定 1/15 日 ——
  # 否则 2.7 GiB 的整段回读会变成每天一次。
  workflow_run:
    workflows: ["Stronghold room observer compatibility"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deep:
        description: '整段哈希的条数：all = 所有带 pin 的条目（默认），数字 = 只取最小的 N 条'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    # 2.7 GiB 在 GitHub runner 到 R2 这个方向实测约 1 分钟走完（54 条 / 最长一条 645 MiB 用 17.4 s），
    # 45 分钟是天花板而不是预期；卡住的条目会先按"连续 90 秒收不到字节"失败并把第几条打在日志里。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 日历守卫（只有 1/15 日或人工/cron 才真跑全量）
        id: gate
        run: |
          day=$(date +%-d)
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ] || [ "$day" = "1" ] || [ "$day" = "15" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "该跑：event=$GITHUB_EVENT_NAME day=$day"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "跳过整段哈希：这次是被 sp-room-api 带起来的（event=$GITHUB_EVENT_NAME day=$day），只在每月 1/15 日真跑，否则 2.7 GiB 会变成每天一次"
          fi
      - name: 逐条整段回读并与 manifest 的 sha256 比对
        if: steps.gate.outputs.run == 'yes'
        env:
          DEEP: ${{ github.event.inputs.deep || 'all' }}
        run: node scripts/check-dl-mirror.mjs --deep "$DEEP"
      - name: 让跳过这件事在日志里可见（不许静默）
        if: steps.gate.outputs.run != 'yes'
        run: echo "::notice::本次触发按日历守卫跳过整段哈希；需要现在验就 workflow_dispatch 一次（默认 all）"
