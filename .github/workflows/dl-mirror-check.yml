name: dl-mirror 公开下载键持续验收

# 为什么单独一条：dl.lain42.top（阿里云 OSS）停用之后，站内链接要切到
# dl.lilyco42.top；切过去之后坏一个键就是用户 404，而这条没人手工盯就不算交付完。
# 浅模式只查头（状态/长度/Content-Type/Range），deep 模式额外整段流式回读比 manifest 的 sha256。
on:
  schedule:
    # 留着，但别指望它 —— 真正的触发见下面 workflow_run。
    - cron: '17 3,9,15,21 * * *'
  # 实测（2026-10-12→13）：这个账号的 GitHub cron 会推迟 6–7 小时，
  # 而我改完排程后到点的槽位一个 run 都没产生：本车道 15:17 UTC 过期 1h19m 仍 0 run，
  # 提醒器仓 source-drift 的 12:23 UTC 同理 0 run（两仓 12:00Z 之后 total runs = 0）。
  # 反过来，同仓库的 sp-room-api（cron '22 2 * * *'）连续两天真落地：10-11 09:04Z、10-12 09:26Z。
  # 所以与其继续加槽位（4 次/天已被证明解决不了），不如挂在一条被证明会跑的 workflow 后面。
  # workflow_run 只能触发同仓库的工作流，所以这层搭桥只能在 ops 仓做。
  workflow_run:
    workflows: ["Stronghold room observer compatibility"]
    types: [completed]
    branches: [main]
  # 再加一条完全不需要定时器的触发：任何进 main 的提交都顺手验一遍。
  # 这条今天就能验证（推本提交本身就会点一次），而 cron 那四条槽位到今天为止落地 0 次。
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/19-r2-download-mirror-gate.md'
      - '.github/workflows/dl-mirror-check.yml'
  workflow_dispatch:
    inputs:
      deep:
        description: '额外对最小的 N 条做整段 sha256 校验（0 = 不做，all = 所有带 pin 的条目；全量走 dl-mirror-deep.yml）'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 闸门自己的失败路径要能红（正向 + 黑洞双对照，全程本地）
        # 这一条是给闸门做的对照：整段回读遇到"连得上、不回包"时必须变成一行 ✗ + 原因，
        # 而不是抛未捕获异常把 job 炸掉 —— CI run 38234496095 就是后者，日志里连卡在第几条都看不到。
        run: node scripts/test-dl-mirror-stall.mjs
      - name: 验收 dl.lilyco42.top 的每个键
        env:
          DEEP: ${{ github.event.inputs.deep || '0' }}
        run: |
          if [ "$DEEP" != "0" ]; then
            node scripts/check-dl-mirror.mjs --deep "$DEEP"
          else
            node scripts/check-dl-mirror.mjs
          fi
      - name: 取站内代码（Pages 仓是公开的）好核对真实引用路径
        # 预检必须能看到站内代码，否则在 runner 上就是个哑巴步骤。
        # 本机跑法是 `node scripts/check-cutover-readiness.mjs D:/Code/lilyco-42.github.io`，
        # CI 里传 'pages' —— 两条路都要求传目录，脚本不再默认某个人的 Windows 路径。
        uses: actions/checkout@v4
        with:
          repository: lilyco-42/lilyco-42.github.io
          path: pages
          persist-credentials: false
      - name: 切流预检：站内真实引用的路径在新桶上是否可达
        # 期望值钉死在脚本的 EXPECTED_MISSING（当前 4 条已知缺口）：
        # 多一条新缺口 → 红；已知缺口被补齐 → 也红（要求删条目，防止缺口清单悄悄过期）。
        # 所以它不会天天红，也就不需要 || echo 那种把死闸门写成绿的写法。
        run: node scripts/check-cutover-readiness.mjs pages
      - name: 期望表本身要和线上 manifest 对齐（防我改漏）
        # 不要在这一步加 `|| echo '::warning::'`：上一版就是这么写的，脚本因为读不到
        # _staging 的草稿 CSV 直接 ENOENT，却被吞成 step success —— 一道从没跑过的闸门。
        # 两个来源都必须非空，否则"清单被线上删空"也会显示成全绿。
        run: |
          node scripts/build-dl-mirror-expected.mjs
          node -e "const t=require('./scripts/dl-mirror-expected.json');const c=(s)=>t.items.filter(i=>i.src===s).length;const p=(s)=>t.items.filter(i=>i.src===s&&i.sha256).length;if(t.items.length<50||p('manifest')<20||p('csv')<30)throw new Error('期望表残缺：共 '+t.items.length+'，manifest '+c('manifest')+'/有pin '+p('manifest')+'，csv '+c('csv')+'/有pin '+p('csv'));console.log('PASS 期望表 '+t.items.length+' 条（manifest '+c('manifest')+'，csv '+c('csv')+'，可验字节 '+p('csv')+' 条，knownGaps '+t.knownGaps.length+'）')"
          git diff --exit-code -- scripts/dl-mirror-expected.json
