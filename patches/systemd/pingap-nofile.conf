[Service]
# pingap 代理 300+ WebSocket 长连接：systemd 默认软限额 1024 会被耗尽
# （表现为 503 "No available upstream" + "os error 24" EMFILE），
# 必须软硬都提到 524288。
#
# ⚠️ 必须写「软:硬」两段。只写 LimitNOFILE=524288 只会设硬限额，
#    软限额仍是 1024，问题照旧。
#
# 安装位置：/etc/systemd/system/pingap.service.d/nofile.conf
# 生效方式：systemctl daemon-reload（对新启动的进程生效）
#           对已在运行的进程用 prlimit 立即生效，不用重启：
#             prlimit --pid $(pgrep -x pingap) --nofile=524288:524288
LimitNOFILE=524288:524288
